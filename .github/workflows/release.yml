name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Verify, package and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Install Chrome for the official DSH Web smoke
        run: pnpm exec playwright install --with-deps chrome
      - run: pnpm verify:release
      - run: pnpm pack:release
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./packages/dsh-plugin/package.json').version")"
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION" || {
            echo "Tag $RELEASE_TAG does not match @oh-story/dsh@$PACKAGE_VERSION" >&2
            exit 1
          }
      - name: Generate checksums
        run: cd release && sha256sum *.tgz > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: oh-story-dsh-${{ github.ref_name }}
          path: |
            release/*.tgz
            release/SHA256SUMS
          if-no-files-found: error
      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/*.tgz release/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/*.tgz release/SHA256SUMS \
              --verify-tag \
              --generate-notes \
              --title "oh-story-dsh $GITHUB_REF_NAME"
          fi
      - name: Publish npm package
        if: startsWith(github.ref, 'refs/tags/')
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./packages/dsh-plugin/package.json').version")"
          if npm view "@oh-story/dsh@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "@oh-story/dsh@$PACKAGE_VERSION is already published"
          else
            npm publish "./release/oh-story-dsh-$PACKAGE_VERSION.tgz" --access public --provenance
          fi
